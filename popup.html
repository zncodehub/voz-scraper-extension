<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .logo {
      width: 28px; height: 28px;
      background: #e8393c;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #fff;
      flex-shrink: 0;
    }
    .title { font-weight: 600; font-size: 14px; color: #fff; }
    .subtitle { font-size: 11px; color: #888; margin-top: 1px; }

    .url-box {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #aaa;
      word-break: break-all;
      margin-bottom: 14px;
      min-height: 38px;
      line-height: 1.5;
    }
    .url-box.valid { border-color: #3a6; color: #7dc; }
    .url-box.invalid { border-color: #a33; color: #f88; }

    .options { margin-bottom: 14px; }
    .option-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      cursor: pointer;
      color: #ccc;
      user-select: none;
    }
    .option-label input[type="checkbox"] {
      accent-color: #e8393c;
      width: 14px; height: 14px;
    }

    .btn {
      width: 100%;
      padding: 9px 0;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: #e8393c;
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 10px;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.ok { background: #1a3a25; color: #6dbb8f; display: block; }
    .status.error { background: #3a1a1a; color: #f07070; display: block; }
    .status.running { background: #1a2a3a; color: #70a8f0; display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">V</div>
    <div>
      <div class="title">VOZ Scraper</div>
      <div class="subtitle">Chạy scrape_voz.py từ browser</div>
    </div>
  </div>

  <div class="url-box" id="url-display">Đang kiểm tra URL...</div>

  <div class="options">
    <label class="option-label">
      <input type="checkbox" id="opt-images" checked>
      --download-images
    </label>
  </div>

  <button class="btn btn-primary" id="scrape-btn" disabled>
    🕷 Scrape thread này
  </button>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
